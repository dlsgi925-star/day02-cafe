<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브루잉로드 - 김포 걸포동 로스팅 카페</title>
  <style>
    :root {
      --wood-dark: #4a2f1d;
      --wood: #8b5e3c;
      --wood-light: #c9a27a;
      --cream: #f6ede0;
      --paper: #fffaf2;
      --text: #3b2a1e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.6;
      font-size: 17px;
    }
    header {
      background: linear-gradient(160deg, var(--wood-dark), var(--wood));
      color: var(--cream);
      text-align: center;
      padding: 48px 20px 36px;
    }
    header h1 { font-size: 2.2rem; letter-spacing: 0.05em; margin-bottom: 8px; }
    header p { margin: 4px 0; }
    header p:nth-of-type(1) { font-size: 1.1rem; color: var(--wood-light); }
    #open-status {
      display: inline-block;
      margin: 14px 0 6px;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(255, 250, 242, 0.15);
      font-weight: 600;
    }
    header p:last-child {
      display: flex;
      gap: 10px;
      max-width: 420px;
      margin: 18px auto 0;
    }
    #btn-call, #btn-map {
      flex: 1;
      padding: 16px 10px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
    }
    #btn-call { background: var(--cream); color: var(--wood-dark); }
    #btn-map { background: var(--wood-light); color: var(--wood-dark); }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 8px; }
    section {
      background: var(--paper);
      border: 1px solid var(--wood-light);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 1.15rem;
      color: var(--wood);
      border-bottom: 2px solid var(--wood-light);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    ul { list-style: none; }
    li { padding: 6px 0; }
    #menu li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--wood-light);
      font-weight: 600;
    }
    #menu li:last-child { border-bottom: none; }
    #menu li span:last-child { color: var(--wood); }
    a { color: var(--wood); font-weight: 600; }
    #location p:last-child a {
      display: inline-block;
      margin-top: 8px;
      padding: 10px 18px;
      background: var(--wood);
      color: var(--cream);
      border-radius: 10px;
      text-decoration: none;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--wood);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header id="intro">
    <h1>브루잉로드</h1>
    <p>매일 아침 볶는 싱글 오리진</p>
    <p>2019년 오픈 · 원두 직접 로스팅</p>
    <p id="open-status"></p>
    <p>
      <a id="btn-call" href="tel:031-000-0000">전화 걸기</a>
      <a id="btn-map" href="https://map.naver.com/p/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EA%B9%80%ED%8F%AC%EC%8B%9C%20%EA%B1%B8%ED%8F%AC%EB%8F%99%20%EB%B8%8C%EB%A3%A8%EC%9E%89%EB%A1%9C%EB%93%9C" target="_blank" rel="noopener">지도 보기</a>
    </p>
  </header>

  <main>

    <section id="menu">
      <h2>메뉴</h2>
      <ul>
        <li><span>핸드드립</span> <span>6,000원</span></li>
        <li><span>플랫화이트</span> <span>5,000원</span></li>
        <li><span>바스크 치즈케이크</span> <span>7,000원</span></li>
      </ul>
    </section>

    <section id="space">
      <h2>공간</h2>
      <ul>
        <li>8석</li>
        <li>노트북 사용 가능</li>
        <li>콘센트 4구</li>
      </ul>
    </section>

    <section id="hours">
      <h2>영업시간</h2>
      <ul>
        <li>평일 8시 ~ 20시</li>
        <li>주말 10시 ~ 18시</li>
        <li>월요일 휴무</li>
      </ul>
    </section>

    <section id="location">
      <h2>위치</h2>
      <p>경기도 김포시 걸포동</p>
      <p>걸포북변역에서 도보 5분</p>
      <p><a href="https://map.naver.com/p/search/%EA%B2%BD%EA%B8%B0%EB%8F%84%20%EA%B9%80%ED%8F%AC%EC%8B%9C%20%EA%B1%B8%ED%8F%AC%EB%8F%99%20%EB%B8%8C%EB%A3%A8%EC%9E%89%EB%A1%9C%EB%93%9C" target="_blank" rel="noopener">지도 보기</a></p>
    </section>

    <section id="contact">
      <h2>연락처</h2>
      <p>전화: <a href="tel:031-000-0000">031-000-0000</a></p>
      <p>인스타그램: <a href="https://www.instagram.com/brewingroad" target="_blank" rel="noopener">@brewingroad</a></p>
    </section>

  </main>

  <footer>
    <p>© 브루잉로드</p>
  </footer>

  <script>
    // 오늘 영업 상태 표시 (월요일 휴무, 평일 8~20시, 주말 10~18시)
    (function () {
      var now = new Date();
      var day = now.getDay(); // 0=일, 1=월
      var hour = now.getHours() + now.getMinutes() / 60;
      var el = document.getElementById('open-status');
      var text;
      if (day === 1) {
        text = '오늘은 휴무일입니다';
      } else {
        var weekend = day === 0 || day === 6;
        var open = weekend ? 10 : 8;
        var close = weekend ? 18 : 20;
        if (hour >= open && hour < close) {
          text = '영업 중 · ' + close + '시까지';
        } else {
          text = '영업 종료 · 오늘 ' + open + '시~' + close + '시';
        }
      }
      el.textContent = text;
    })();
  </script>

</body>
</html>
